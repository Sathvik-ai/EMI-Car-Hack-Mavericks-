<div class="container animate-fade-in" style="padding: 60px 20px;">
  <div class="text-center mb-5">
    <h1 style="font-size: 3rem;">Get in <span style="color: var(--primary-gold);">Touch</span></h1>
    <p style="color: var(--secondary-platinum);">We are here to help you 24/7</p>
  </div>

  <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 50px; align-items: start;">
    <!-- Contact Info -->
    <div>
      <div class="glass-card" style="padding: 40px; margin-bottom: 30px;">
        <h3 style="color: var(--primary-gold); margin-bottom: 20px;">Headquarters</h3>
        <p style="margin-bottom: 10px;">📍 12th Floor, Cyber City, Gurugram, India</p>
        <p style="margin-bottom: 10px;">📞 +91 1800-LUXE-CAR</p>
        <p>✉️ support@luxefinance.com</p>
      </div>

      <div class="glass-card" style="padding: 40px;">
        <h3 style="color: var(--primary-gold); margin-bottom: 20px;">Connect With Us</h3>
        <div style="display: flex; gap: 20px; font-size: 1.5rem;">
          <span>📱</span>
          <span>💼</span>
          <span>🐦</span>
          <span>📸</span>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div class="glass-card" style="padding: 40px;">
      <h3 style="margin-bottom: 30px;">Send a Message</h3>
      <form>
        <div class="form-group mb-3">
          <label style="display: block; margin-bottom: 10px; color: var(--secondary-platinum);">Your Name</label>
          <input type="text" class="form-control input-gold" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;">
        </div>
        <div class="form-group mb-3">
          <label style="display: block; margin-bottom: 10px; color: var(--secondary-platinum);">Email Address</label>
          <input type="email" class="form-control input-gold" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;">
        </div>
        <div class="form-group mb-3">
          <label style="display: block; margin-bottom: 10px; color: var(--secondary-platinum);">Message</label>
          <textarea rows="4" class="form-control input-gold" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;"></textarea>
        </div>
        <button type="button" class="btn-gold" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </div>
</div>
